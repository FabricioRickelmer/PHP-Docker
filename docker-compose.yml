services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Student API"
      APP_ENV: local
      APP_KEY: "base64:u/T1u5g9d2e1B3c4D5e6F7g8H9i0J1k2L3m4N5o6P7Q="
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: student_db
      DB_USERNAME: student_user
      DB_PASSWORD: secret
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailcatcher
      MAIL_PORT: 1025
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailcatcher:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: student_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: student_db
      MYSQL_USER: student_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: student_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailcatcher:
    image: dockage/mailcatcher:latest
    container_name: student_mailcatcher
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "1080:1080"

volumes:
  mysql_data:
  redis_data:
